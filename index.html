<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Assistant</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header class="header">

            <div class="logo">
                <div class="logo-icon">✦</div>
                <span>AI Assistant</span>
            </div>

            <div class="status">
                <span class="status-dot"></span>
                AI Ready
            </div>

        </header>


        <section class="hero">

            <div class="badge">
                ✨ Powered by AI
            </div>

            <h1>
                Ask anything.<br>
                <span>Learn everything.</span>
            </h1>

            <p>
                Get clear and helpful answers to your questions.
                Explore ideas, understand concepts, and solve problems
                with the help of AI.
            </p>

        </section>


        <section class="ask-section">

            <form id="form">

                <div class="input-wrapper">

                    <span class="input-icon">✦</span>

                    <input
                        type="text"
                        id="inputbox"
                        placeholder="What would you like to know?"
                        autocomplete="off"
                        required
                    >

                </div>

                <button type="submit" id="btn">
                    Ask AI
                    <span>→</span>
                </button>

            </form>


            <div class="suggestions">

                <span>Try asking:</span>

                <button type="button">
                    What is JavaScript?
                </button>

                <button type="button">
                    Explain APIs simply
                </button>

                <button type="button">
                    Give me a coding idea
                </button>

            </div>

        </section>


        <section class="response-section">

            <div class="response-header">

                <div>
                    <h2>AI Response</h2>
                    <p>Your answer will appear here</p>
                </div>

                <span class="response-icon">✦</span>

            </div>

            <div id="output"></div>

        </section>


        <footer>
            Built with HTML, CSS, JavaScript & AI
        </footer>

    </main>


    <script src="script.js"></script>

</body>

</html>
